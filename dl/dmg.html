<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Téléchargement NotchIA…</title>
<meta name="robots" content="noindex, follow" />
<meta name="theme-color" content="#0B0D12" />
<link rel="icon" type="image/png" sizes="192x192" href="/favicon.png" />

<!-- Cloudflare Web Analytics est injecté automatiquement par Cloudflare Pages
     quand Web Analytics est activé sur le projet. Aucun script à coller ici. -->

<style>
  :root { --ink:#0B0D12; --cream:#EDE8DC; --violet:#A855F7; --magenta:#FF4D88; --orange:#FF7A2D; --cyan:#4DA8FF; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; }
  body {
    background: var(--ink); color: var(--cream);
    font-family: 'Instrument Sans', system-ui, -apple-system, sans-serif;
    display:flex; align-items:center; justify-content:center;
    padding:2rem; text-align:center;
    background-image:
      radial-gradient(ellipse at top, rgba(168,85,247,.12), transparent 50%),
      radial-gradient(ellipse at bottom right, rgba(77,168,255,.08), transparent 50%);
  }
  .wrap { max-width: 520px; width: 100%; }
  .logo { width:64px; height:64px; margin:0 auto 1.5rem; border-radius:14px; box-shadow:0 8px 24px rgba(0,0,0,.4); display:block; }
  h1 { font-size: 1.5rem; font-weight: 500; margin-bottom: .5rem; letter-spacing:-.01em; }
  p { opacity: .7; font-size: .95rem; line-height: 1.55; margin-bottom: 1rem; }
  .spinner {
    width:32px; height:32px; margin:0 auto 1.5rem;
    border:3px solid rgba(237,232,220,.15);
    border-top-color: var(--magenta);
    border-radius:50%;
    animation: spin .8s linear infinite;
  }
  .spinner.done {
    border-top-color: #9DD9B7;
    animation: none;
    transform: scale(1);
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .actions { margin-top: 1.75rem; display:flex; gap:.75rem; flex-wrap:wrap; justify-content:center; }
  .btn {
    display:inline-flex; align-items:center; gap:.5rem;
    padding:.75rem 1.25rem; border-radius:12px;
    text-decoration:none; font-weight:500; font-size:.95rem;
    transition: transform .15s ease, opacity .15s ease;
    cursor:pointer; border:0;
    font-family:inherit;
  }
  .btn:hover { transform: translateY(-1px); }
  .btn.primary {
    background: linear-gradient(90deg, var(--violet) 0%, var(--magenta) 30%, var(--orange) 60%, var(--cyan) 100%);
    color: var(--ink);
  }
  .btn.ghost {
    border: 1px solid rgba(237,232,220,.18);
    color: var(--cream);
    background: transparent;
  }
  .btn.ghost:hover { background: rgba(237,232,220,.06); }
  .fallback { margin-top:1.25rem; font-size:.85rem; opacity:.55; }
  .fallback a { color: var(--orange); text-decoration: underline; text-underline-offset: 3px; }
  .fallback a:hover { color: var(--magenta); }
  .lang-row { margin-top:2rem; display:flex; gap:.5rem; justify-content:center; opacity:.45; font-family:'JetBrains Mono', ui-monospace, monospace; font-size:11px; }
  .lang-row button { background:transparent; border:0; color:inherit; cursor:pointer; padding:.2rem .45rem; font:inherit; }
  .lang-row button.on { opacity:1; text-decoration: underline; }
</style>
</head>
<body>
<main class="wrap">
  <img src="/logo.png" alt="" width="64" height="64" class="logo" />
  <div id="spinner" class="spinner" aria-hidden="true"></div>
  <h1 id="title">Téléchargement de NotchIA…</h1>
  <p id="desc">NotchIA.dmg s'ouvre automatiquement dans quelques secondes.</p>

  <div class="actions">
    <a id="next" href="/install" class="btn primary">
      <span id="next-label">Voir les étapes d'installation</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
    </a>
    <a id="home" href="/" class="btn ghost">
      <span id="home-label">Retour à l'accueil</span>
    </a>
  </div>

  <p class="fallback">
    <span id="fallback-text">Si le téléchargement ne démarre pas,</span>
    <a id="manual" href="https://github.com/coaxel2/NotchIA/releases/latest/download/NotchIA.dmg">
      <span id="manual-label">clique ici</span>
    </a>.
  </p>

  <div class="lang-row" id="lang-row">
    <button data-lang="fr">FR</button>
    <button data-lang="en">EN</button>
    <button data-lang="es">ES</button>
    <button data-lang="de">DE</button>
  </div>
</main>

<script>
  const DMG_URL = "https://github.com/coaxel2/NotchIA/releases/latest/download/NotchIA.dmg";

  const I = {
    fr: { title:"Téléchargement de NotchIA…", done:"NotchIA.dmg est en cours de téléchargement.", desc:"NotchIA.dmg s'ouvre automatiquement dans quelques secondes.", next:"Voir les étapes d'installation", home:"Retour à l'accueil", fb:"Si le téléchargement ne démarre pas,", manual:"clique ici" },
    en: { title:"Downloading NotchIA…",          done:"NotchIA.dmg is downloading.",                desc:"NotchIA.dmg starts automatically in a few seconds.",        next:"See installation steps",      home:"Back to home",          fb:"If the download doesn't start,",     manual:"click here" },
    es: { title:"Descargando NotchIA…",          done:"NotchIA.dmg se está descargando.",          desc:"NotchIA.dmg se inicia automáticamente en unos segundos.",   next:"Ver los pasos de instalación",home:"Volver al inicio",      fb:"Si la descarga no empieza,",         manual:"haz clic aquí" },
    de: { title:"NotchIA wird heruntergeladen…", done:"NotchIA.dmg wird heruntergeladen.",          desc:"NotchIA.dmg startet in wenigen Sekunden automatisch.",      next:"Installationsschritte ansehen",home:"Zur Startseite",       fb:"Falls der Download nicht startet,",  manual:"hier klicken" },
  };

  function detectLang() {
    try { const s = localStorage.getItem('notchia-lang'); if (s && I[s]) return s; } catch(e) {}
    const b = (navigator.language || 'en').toLowerCase().split('-')[0];
    return I[b] ? b : 'en';
  }

  function applyLang(lang) {
    if (!I[lang]) lang = 'en';
    const t = I[lang];
    document.documentElement.lang = lang;
    document.getElementById('title').textContent      = t.title;
    document.getElementById('desc').textContent       = t.desc;
    document.getElementById('next-label').textContent = t.next;
    document.getElementById('home-label').textContent = t.home;
    document.getElementById('fallback-text').textContent = t.fb;
    document.getElementById('manual-label').textContent = t.manual;
    document.querySelectorAll('#lang-row button').forEach(b => b.classList.toggle('on', b.dataset.lang === lang));
    try { localStorage.setItem('notchia-lang', lang); } catch(e) {}
  }

  let currentLang = detectLang();
  applyLang(currentLang);

  document.querySelectorAll('#lang-row button').forEach(b => {
    b.addEventListener('click', () => { currentLang = b.dataset.lang; applyLang(currentLang); });
  });

  // Déclenche le download via lien invisible (plus fiable que meta refresh
  // et conserve l'utilisateur sur cette page jusqu'au redirect ci-dessous).
  const a = document.createElement('a');
  a.href = DMG_URL;
  a.setAttribute('download', '');
  a.style.display = 'none';
  document.body.appendChild(a);
  a.click();

  // Bascule l'état visuel sur "téléchargé" puis redirige vers /install
  setTimeout(() => {
    document.getElementById('spinner').classList.add('done');
    document.getElementById('desc').textContent = I[currentLang].done;
  }, 1200);

  // Auto-redirect vers les instructions d'installation après 3 s — laisse
  // assez de temps au navigateur pour démarrer le download, et l'utilisateur
  // arrive directement sur la page utile (étapes post-DMG).
  setTimeout(() => {
    window.location.href = '/install';
  }, 3000);
</script>
</body>
</html>
