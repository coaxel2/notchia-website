<style>
  :root { --ink:#0B0D12; --cream:#EDE8DC; --violet:#A855F7; --magenta:#FF4D88; --orange:#FF7A2D; --cyan:#4DA8FF; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--ink); color: var(--cream);
    font-family: 'Instrument Sans', system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: 2rem; text-align: center;
    background-image: radial-gradient(ellipse at top, rgba(168,85,247,.12), transparent 50%),
                      radial-gradient(ellipse at bottom right, rgba(77,168,255,.08), transparent 50%);
  }
  .wrap { max-width: 640px; }
  .num {
    font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-style: italic;
    font-size: clamp(96px, 22vw, 220px); line-height: .9; letter-spacing: -.04em;
    background: linear-gradient(90deg, var(--violet), var(--magenta), var(--orange), var(--cyan));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    padding-bottom: .15em;
  }
  h1 {
    font-family: 'Fraunces', Georgia, serif; font-weight: 500;
    font-size: clamp(24px, 5vw, 36px); margin-top: 1rem; letter-spacing: -.01em;
  }
  p { font-size: clamp(15px, 2.2vw, 18px); margin-top: 1rem; opacity: .8; line-height: 1.55; }
  .actions { margin-top: 2rem; display: flex; gap: .75rem; flex-wrap: wrap; justify-content: center; }
  a.btn {
    display: inline-block; padding: .75rem 1.25rem; border-radius: 12px;
    text-decoration: none; font-weight: 500; font-size: 15px;
    transition: transform .15s ease, opacity .15s ease;
  }
  a.btn:hover { transform: translateY(-1px); }
  a.primary { background: var(--cream); color: var(--ink); }
  a.ghost { border: 1px solid rgba(237,232,220,.2); color: var(--cream); }
  .langs { margin-top: 2rem; display: flex; gap: .5rem; justify-content: center; }
  .lang-sw { appearance: none; -webkit-appearance: none; background-color: transparent; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 24 24' fill='none' stroke='%23808998' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'><path d='M6 9l6 6 6-6'/></svg>"); background-repeat: no-repeat; background-position: right 10px center; background-size: 9px; border: 1px solid rgba(237,232,220,0.15); color: rgba(237,232,220,0.7); font-family: 'JetBrains Mono', monospace; font-size: 11px; padding: 4px 26px 4px 10px; border-radius: 999px; cursor: pointer; }
  .lang-sw:hover { color: var(--cream); }
  .sub-en, .sub-es, .sub-de { display: none; }
</style>
</head>
<body>
<main class="wrap">
  <div class="num">404</div>
  <h1 data-i18n="t">Cette page n'existe pas.</h1>
  <p data-i18n="d">Le lien que tu as suivi est cassé, déplacé, ou n'a jamais existé. Aucun problème — voilà où aller.</p>
  <div class="actions">
    <a href="/" class="btn primary" data-i18n="home">Retour à l'accueil</a>
    <a href="/install" class="btn ghost" data-i18n="install">Télécharger NotchIA</a>
    <a href="/blog/meilleures-apps-mac-2026" class="btn ghost" data-i18n="blog">Lire le blog</a>
  </div>
  <div class="langs">
    <select id="lang-switch" class="lang-sw" aria-label="Language">
      <option value="fr">FR</option><option value="en">EN</option><option value="es">ES</option><option value="de">DE</option>
    </select>
  </div>
</main>
<script>
  const I = {
    fr: { t: "Cette page n'existe pas.", d: "Le lien que tu as suivi est cassé, déplacé, ou n'a jamais existé. Aucun problème — voilà où aller.", home: "Retour à l'accueil", install: "Télécharger NotchIA", blog: "Lire le blog" },
    en: { t: "This page doesn't exist.", d: "The link you followed is broken, moved, or never existed. No worries — here's where to go.", home: "Back to home", install: "Download NotchIA", blog: "Read the blog" },
    es: { t: "Esta página no existe.", d: "El enlace que seguiste está roto, se ha movido, o nunca existió. Sin problema — aquí tienes adónde ir.", home: "Volver al inicio", install: "Descargar NotchIA", blog: "Leer el blog" },
    de: { t: "Diese Seite existiert nicht.", d: "Der Link, dem du gefolgt bist, ist defekt, verschoben oder hat nie existiert. Kein Problem — hier geht es weiter.", home: "Zur Startseite", install: "NotchIA herunterladen", blog: "Zum Blog" }
  };
  function apply(lang) {
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const k = el.getAttribute('data-i18n');
      if (I[lang] && I[lang][k]) el.textContent = I[lang][k];
    });
    const sel = document.getElementById('lang-switch');
    if (sel) sel.value = lang;
    /* persistance uniquement sur choix explicite */
  }
  // Détection : localStorage > navigator.language > fr
  let initLang = 'fr';
  try { const s = localStorage.getItem('notchia-lang-choice'); if (s && I[s]) initLang = s; } catch(_){}
  if (initLang === 'fr') {
    const nav = (navigator.language || 'fr').toLowerCase().slice(0, 2);
    if (['fr','en','es','de'].includes(nav)) initLang = nav;
  }
  apply(initLang);
  document.getElementById('lang-switch')?.addEventListener('change', e => {
    try { localStorage.setItem('notchia-lang-choice', e.target.value); } catch(_){}
    apply(e.target.value);
  });
</script>
</body>
</html>
